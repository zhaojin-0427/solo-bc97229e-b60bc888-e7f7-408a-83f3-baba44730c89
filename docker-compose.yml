services:
  sample-ingest:
    build:
      context: .
    image: sample-ingest:local
    ports:
      - "${HOST_PORT:-5000}:5000"
    environment:
      DATA_DIR: /data
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-17179869184}"
      JOB_WORKERS: "${JOB_WORKERS:-1}"
      KEEP_RELEASES: "${KEEP_RELEASES:-2}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - sample-ingest-data:/data
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  sample-ingest-data:
